name: Statistiques Instagram

on:
  schedule:
    - cron: "40 15 * * *"   # chaque jour, avant l'expiration de la story de la veille
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kulturable-repo-write
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Relever
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/stats.py
      - name: Enregistrer
        run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add posts/stats
          git diff --cached --quiet || (git commit -m "Statistiques" && git pull --rebase && git push)
