name: Exporter les publications Instagram

on:
  push:
    branches: [main]
    paths: ["scripts/export_instagram.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kulturable-repo-write
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/export_instagram.py
      - name: Enregistrer l'export
        run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add posts/instagram-export.json
          git diff --cached --quiet || (git commit -m "Export des publications Instagram" && git pull --rebase && git push)
