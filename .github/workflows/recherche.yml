name: Recherche d'images
on:
  push:
    branches: [recherche]
    paths: ["recherche/queries.json"]
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 recherche/lookup.py
      - run: |
          git config user.name "kulturable-bot"; git config user.email "kulturable-bot@users.noreply.github.com"
          git add recherche && git commit -m "Résultats de recherche" && git push
