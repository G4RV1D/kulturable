name: Monter les vidéos TikTok

on:
  push:
    branches: [main]
    paths: ["tiktok/**", "scripts/make_video.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kulturable-repo-write
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow imageio-ffmpeg numpy faster-whisper
      - run: python scripts/make_video.py
      - name: Enregistrer les vidéos
        run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add tiktok
          git diff --cached --quiet || (git commit -m "Vidéos TikTok prêtes" && git pull --rebase && git push)
