name: Monter les Reels

on:
  push:
    branches: [main]
    paths: ["reels/**/reel.json", "scripts/make_reel.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kulturable-repo-write
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow imageio-ffmpeg numpy
      - run: python scripts/make_reel.py
      - name: Crédits des images
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "scripts")
          from check_credits import info
          for cfg in sorted(pathlib.Path("reels").glob("*/reel.json")):
              for name, src in json.loads(cfg.read_text(encoding="utf-8")).get("images", {}).items():
                  if src.startswith("File:"):
                      print(cfg.parent.name, "|", src, "|", info(src))
          PY
      - name: Enregistrer les aperçus
        if: always()
        run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add reels/*/apercu.mp4
          git diff --cached --quiet || (git commit -m "Aperçus des Reels" && git pull --rebase && git push)
