name: Préparer les images

on:
  push:
    branches: [main]
    paths: ["posts/**", "scripts/prepare_images.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kulturable-repo-write
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/prepare_images.py
      - name: Enregistrer les images
        run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Images prêtes" && git push)
