name: Préparer les images

on:
  push:
    branches: [main]
    paths: ["posts/**", "scripts/prepare_images.py", "scripts/make_story.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kulturable-repo-write
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - run: python scripts/prepare_images.py
      - name: Enregistrer les images
        if: always()
        run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add images stories
          git diff --cached --quiet || (git commit -m "Images prêtes" && git push)
