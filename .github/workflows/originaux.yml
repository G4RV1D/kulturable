name: Récupérer les photos publiées

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kulturable-repo-write
  cancel-in-progress: false

jobs:
  originaux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_originaux.py
      - run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add posts/originaux
          git diff --cached --quiet || (git commit -m "Photos publiées sur Instagram" && git pull --rebase && git push)
