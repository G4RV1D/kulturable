name: Publier sur Instagram

on:
  push:
    branches: [main]
    paths: ["posts/queue.json"]
  schedule:
    # GitHub déclenche souvent ces tâches avec plusieurs heures de retard : on vérifie souvent,
    # et dès qu'un post est prévu dans les ~5 h 40, on attend son heure exacte puis on publie.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (ne publie rien)"
        type: boolean
        default: true
      force_id:
        description: "Publier tout de suite ce post (ex. 01-violet-jessop)"
        type: string
        default: ""
      story_only:
        description: "Publier seulement la story de ce post déjà publié"
        type: string
        default: ""
      relais:
        description: "Usage interne : relance automatique de la surveillance"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  attendre:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # une seule attente à la fois ; elle ne bloque pas la préparation des images
    concurrency:
      group: kulturable-attente
      cancel-in-progress: false
    outputs:
      go: ${{ steps.wait.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.relais }}" != "true" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          s=$(python3 scripts/next_due.py)
          # Relais : GitHub lance les tâches planifiées de façon irrégulière (parfois 7 h d'écart).
          # Chaque surveillance relance donc la suivante avant de se terminer : il y a toujours une surveillance active.
          relay() { gh workflow run publish.yml --ref main -f dry_run=false -f relais=true || true; }
          if [ "$s" -lt 0 ]; then
            echo "Rien à publier dans les prochaines heures : surveillance pendant 5 h 30, puis relais."
            sleep 19800
            relay
            echo "go=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Prochain post dans $s s, on attend."
          sleep "$s"
          sleep 20
          git pull -q origin main   # une autre exécution a peut-être déjà publié
          s2=$(python3 scripts/next_due.py)
          relay
          if [ "$s2" -ne 0 ]; then echo "Déjà publié par une autre exécution."; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"

  publish:
    needs: attendre
    if: needs.attendre.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: kulturable-repo-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Publier
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/images
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE_ID: ${{ inputs.force_id }}
          STORY_ONLY: ${{ inputs.story_only }}
        run: python scripts/publish.py
      - name: Noter la publication
        run: |
          git config user.name "kulturable-bot"
          git config user.email "kulturable-bot@users.noreply.github.com"
          git add posts/queue.json posts/stats
          git diff --cached --quiet || (git commit -m "Post publié" && git pull --rebase && git push)
